baseURL = "https://wm920.github.io/"
languageCode = "zh-CN"
title = "Min的博客"
theme = "PaperMod"
enableRobotsTXT = true
buildDrafts = false
buildFuture = false

[pagination]
pagerSize = 10

[params]
  env = "production"
  title = "Min的博客"
  description = "技术学习笔记与教程"
  author = "Min"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowWordCount = true

  homeTitle = "Min 的博客"
  homeSubtitle = "记录技术学习笔记、读书思考与日常"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/wm920"

  [params.math]
    enable = true

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    style = "monokai"

  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 2
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 3
